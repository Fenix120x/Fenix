<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

  <!-- Song 1 -->  
  <div id="song1" class="song">
    <div class="top-number" data-num="01"></div>
    <div class="song-content">
      <img src="golden hour.jpg" alt="Golden Hour">
      <div class="details">
        <h1>Golden Hour</h1>
        <h3>JVKE</h3>
        <div class="time"><span>1:20</span><span>3:52</span></div>
        <div class="progress"><div class="progress-filled"></div></div>
        <div class="controls">
          <button class="control-btn"><span class="material-icons">skip_previous</span></button>
          <button class="control-btn play-pause"><span class="material-icons">play_arrow</span></button>
          <button class="control-btn"><span class="material-icons">skip_next</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Song 2 -->
  <div id="song2" class="song">
    <div class="top-number" data-num="02"></div>
    <div class="song-content">
      <img src="super.jpg" alt="Superpowers">
      <div class="details">
        <h1>Superpowers</h1>
        <h3>Daniel Caesar</h3>
        <div class="time"><span>0:58</span><span>2:55</span></div>
        <div class="progress"><div class="progress-filled"></div></div>
        <div class="controls">
          <button class="control-btn"><span class="material-icons">skip_previous</span></button>
          <button class="control-btn play-pause"><span class="material-icons">play_arrow</span></button>
          <button class="control-btn"><span class="material-icons">skip_next</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Song 3 -->
  <div id="song3" class="song">
    <div class="top-number" data-num="03"></div>
    <div class="song-content">
      <img src="jeffhardy.jpg" alt="Jeff Hardy">
      <div class="details">
        <h1>Fancy</h1>
        <h3>Drake</h3>
        <div class="time"><span>2:00</span><span>5:20</span></div>
        <div class="progress"><div class="progress-filled"></div></div>
        <div class="controls">
          <button class="control-btn"><span class="material-icons">skip_previous</span></button>
          <button class="control-btn play-pause"><span class="material-icons">play_arrow</span></button>
          <button class="control-btn"><span class="material-icons">skip_next</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Song 4 -->
  <div id="song4" class="song">
    <div class="top-number" data-num="04"></div>
    <div class="song-content">
      <img src="daniel.jpg" alt="Daniel Caesar">
      <div class="details">
        <h1>Hold Me Down</h1>
        <h3>Daniel Caesar</h3>
        <div class="time"><span>1:10</span><span>3:52</span></div>
        <div class="progress"><div class="progress-filled"></div></div>
        <div class="controls">
          <button class="control-btn"><span class="material-icons">skip_previous</span></button>
          <button class="control-btn play-pause"><span class="material-icons">play_arrow</span></button>
          <button class="control-btn"><span class="material-icons">skip_next</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Song 5 -->
  <div id="song5" class="song">
    <div class="top-number" data-num="05"></div>
    <div class="song-content">
      <img src="wind.jpg" alt="Wind">
      <div class="details">
        <h1>Wind</h1>
        <h3>Akeboshi</h3>
        <div class="time"><span>0:59</span><span>3:41</span></div>
        <div class="progress"><div class="progress-filled"></div></div>
        <div class="controls">
          <button class="control-btn"><span class="material-icons">skip_previous</span></button>
          <button class="control-btn play-pause"><span class="material-icons">play_arrow</span></button>
          <button class="control-btn"><span class="material-icons">skip_next</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Song 6 -->
  <div id="song6" class="song">
    <div class="top-number" data-num="06"></div>
    <div class="song-content">
      <img src="l.jpg" alt="New Song">
      <div class="details">
        <h1>Hex</h1>
        <h3>80purppp</h3>
        <div class="time"><span>0:40</span><span>2:03</span></div>
        <div class="progress"><div class="progress-filled"></div></div>
        <div class="controls">
          <button class="control-btn"><span class="material-icons">skip_previous</span></button>
          <button class="control-btn play-pause"><span class="material-icons">play_arrow</span></button>
          <button class="control-btn"><span class="material-icons">skip_next</span></button>
        </div>
      </div>
    </div>
  </div>

<!-- Right-side Navbar -->
<body>

     <li><a href="#home">Home</a></li>

  <div id="song1" class="song"> ... </div>

  <!-- Playlist -->
  <div class="playlist">
    <a href="#song1"></a>
    <a href="#song2"></a>
    <a href="#song3"></a>
    <a href="#song4"></a>
    <a href="#song5"></a>

</html>
